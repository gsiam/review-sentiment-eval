[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval"
version = "0.1.0"
description = "LLM Evaluation Suite for testing summarization capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "ragas>=0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-cov>=5.0.0"
]
local = [
    "langchain-ollama>=0.3.0",
]
docs = [
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = [
    "unit: marks unit tests (no API calls, fast)",
    "integration: marks integration tests (real API calls, slow)",
    "ragas_ci: marks tests that use Ragas evaluation (may be slow)",
    "adversarial: marks tests for prompt injection robustness",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli_format = "%(message)s"

[tool.coverage.run]
source = ["src/llm_eval"]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
omit = ["tests/*", "conftest.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
